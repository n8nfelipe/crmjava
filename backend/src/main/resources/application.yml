spring:
  application.name: crm-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate:
      jdbc.time_zone: UTC
      default_batch_fetch_size: 50
  flyway.enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  jackson.default-property-inclusion: non_null
server:
  error.include-message: never
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  health.livenessstate.enabled: true
  health.readinessstate.enabled: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:development-secret-change-me-32-chars}
    access-ttl: PT15M
    refresh-ttl: P30D
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
logging:
  pattern.console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","message":"%replace(%msg){''"'',''\\"''}"}%n'
